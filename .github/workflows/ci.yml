name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm exec biome ci --reporter=github .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the Chrome and Firefox archives
        run: pnpm zip

      - name: Keep the archives, to try this build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-null-ext-${{ github.sha }}
          path: |
            apps/extension/.output/*-chrome.zip
            apps/extension/.output/*-firefox.zip
          if-no-files-found: error
          # WXT builds into .output, which the action skips as hidden otherwise.
          include-hidden-files: true
          retention-days: 14
